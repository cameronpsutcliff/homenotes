<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HomeNotes</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090f; --card: #0c1119; --line: #1a2231; --line2: #263043;
      --tx: #e6ecf4; --mu: #9aa7bb; --di: #7a879c;
      --cy: #22d3ee; --gr: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px; margin: 0; padding: 14px; background: var(--bg); color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-size: 12.5px; line-height: 1.45;
    }
    .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--cy); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cy); box-shadow: 0 0 8px var(--cy); }
    .ver { font-size: 10.5px; color: var(--di); }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 11px 12px; margin-bottom: 10px;
    }
    label { display: block; font-size: 11px; color: var(--mu); margin-bottom: 4px; font-weight: 600; }
    input[type="text"] {
      width: 100%; background: var(--bg); color: var(--tx); border: 1px solid var(--line2);
      border-radius: 7px; padding: 7px 9px; font-size: 12px; margin-bottom: 8px; outline: none;
    }
    input:focus { border-color: var(--cy); }
    .row { display: flex; gap: 6px; align-items: center; }
    .btn {
      background: var(--cy); color: #07090f; border: none; border-radius: 7px;
      padding: 7px 11px; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .check-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: var(--mu); font-size: 12px; }
    .saved { color: var(--gr); font-size: 11.5px; font-weight: 600; margin-left: 8px; }
    .sec-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--di); margin: 0 0 8px 0; font-weight: 600;
    }
    .recent-list { display: flex; flex-direction: column; gap: 7px; max-height: 210px; overflow-y: auto; }
    .recent-item {
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px;
    }
    .recent-item a { color: var(--cy); text-decoration: none; font-weight: 600; font-size: 12px; }
    .recent-item a:hover { text-decoration: underline; }
    .recent-meta { font-size: 11px; color: var(--mu); margin-top: 2px; }
    .recent-body { font-size: 11.5px; color: var(--tx); margin-top: 4px; }
    .foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--di); margin-top: 6px; }
    .foot a { color: var(--mu); text-decoration: none; }
    .foot a:hover { color: var(--cy); }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="brand"><span class="dot"></span><span>HomeNotes</span></div>
    <span class="ver">v1.1.0 &middot; 7 Real Estate Sites</span>
  </div>

  <div class="card">
    <label for="handle">Display Handle</label>
    <input id="handle" type="text" placeholder="e.g. buyer_tx or local_scout" maxlength="40" />

    <label class="check-row">
      <input id="autoOpen" type="checkbox" />
      <span>Auto-open drawer on listing pages</span>
    </label>

    <div class="row" style="margin-top:10px;">
      <button id="saveBtn" class="btn" type="button">Save Settings</button>
      <span id="saveMsg" class="saved"></span>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">Recent Buyer Reality Checks</div>
    <div class="recent-list" id="recentList">
      <div style="color:#7a879c;font-size:11.5px;">Loading recent activity...</div>
    </div>
  </div>

  <div class="foot">
    <span>Open Buyer Commentary</span>
    <a href="https://homenotes.cameronsutcliff.com/privacy" target="_blank" rel="noopener">Privacy Policy</a>
  </div>

  <script src="lib/extractor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
